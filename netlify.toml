[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"
  framework = "#custom"
  autoLaunch = false

[functions]
  directory = "netlify/functions"

# Keep this SPA fallback after function routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
